; =====================================================================
; .user.ini - UNTUK FOLDER PUBLIC (public_html/)
; Dibaca oleh PHP CGI/FastCGI di shared hosting (CloudLinux/cPanel Liiqu.id)
; Ini TEMPAT UTAMA setting PHP size di shared hosting
; =====================================================================

upload_max_filesize = 256M
post_max_size = 260M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000
memory_limit = 512M

date.timezone = Asia/Jakarta
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
html_errors = Off

session.save_handler = files
session.gc_maxlifetime = 3600
session.cookie_httponly = On
session.cookie_secure = On
session.cookie_samesite = Lax

allow_url_fopen = On
allow_url_include = Off

file_uploads = On
max_file_uploads = 20
upload_tmp_dir = "/tmp"
